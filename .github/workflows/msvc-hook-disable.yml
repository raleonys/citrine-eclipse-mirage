name: Windows MithrilHook integration acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-disable:
    name: Windows x64 MithrilHook ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Configure focused native hook acceptance
        run: |
          $build = 'build/ci-hook-${{ matrix.configuration }}'
          cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DLAUREONDO_BUILD_SOURCE_API_DLL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'MSVC hook configure failed' }
      - name: Verify actual generated test target ownership
        run: |
          $build = 'build/ci-hook-${{ matrix.configuration }}'
          python -B scripts/check_build_partition.py --build-dir $build --config '${{ matrix.configuration }}' --graph-only --report "$build/hook-partition.json"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC hook target ownership failed' }
      - name: Build immutable engine and Laureondo integration tests
        run: |
          $build = 'build/ci-hook-${{ matrix.configuration }}'
          cmake --build $build --config '${{ matrix.configuration }}' --target laureondo_hook_acceptance --parallel 2 2>&1 | Tee-Object -FilePath "$build/hook-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC hook build failed' }
      - name: Bind focused test binaries to their source commit
        run: |
          $build = 'build/ci-hook-${{ matrix.configuration }}'
          $rootTests = @('hook_backend_contracts', 'hook_transaction_contracts', 'application_runtime_contracts')
          $files = @(Get-ChildItem $build -Recurse -File | Where-Object {
            ($_.Extension -eq '.exe' -and ($_.BaseName -like 'mithrilhook_*' -or $_.BaseName -in $rootTests)) -or
            $_.Name -eq 'laureondo_online.dll'
          })
          foreach ($target in $rootTests) {
            if (@($files | Where-Object BaseName -eq $target).Count -ne 1) { throw "Missing or ambiguous project test: $target" }
          }
          if (@($files | Where-Object Name -eq 'laureondo_online.dll').Count -ne 1) { throw 'Missing or ambiguous provider fixture' }
          $binaries = foreach ($path in $files) {
            @{ path = $path.FullName.Substring((Resolve-Path $build).Path.Length + 1); sha256 = (Get-FileHash -Algorithm SHA256 $path.FullName).Hash.ToLowerInvariant() }
          }
          @{ commit = '${{ github.sha }}'; configuration = '${{ matrix.configuration }}'; source_manifest_sha256 = (Get-FileHash metadata/ACTIVE_SOURCE_MANIFEST.json -Algorithm SHA256).Hash.ToLowerInvariant(); binaries = @($binaries) } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$build/hook-binary-identities.json"
      - name: Run native hook regressions
        run: |
          $build = 'build/ci-hook-${{ matrix.configuration }}'
          $junit = Join-Path (Resolve-Path $build) 'hook-junit.xml'
          ctest --test-dir $build -C '${{ matrix.configuration }}' -R '^(mithrilhook_.+|hook_(backend_contracts|transaction_contracts)|application_runtime_contracts)$' --no-tests=error --output-on-failure --output-junit $junit 2>&1 | Tee-Object -FilePath "$build/hook-ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC hook regression failed' }
      - name: Preserve native hook evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msvc-hook-${{ matrix.configuration }}-evidence
          path: |
            build/ci-hook-${{ matrix.configuration }}/hook-build.log
            build/ci-hook-${{ matrix.configuration }}/hook-ctest.log
            build/ci-hook-${{ matrix.configuration }}/hook-junit.xml
            build/ci-hook-${{ matrix.configuration }}/hook-binary-identities.json
            build/ci-hook-${{ matrix.configuration }}/hook-partition.json
            build/ci-hook-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
            build/ci-hook-${{ matrix.configuration }}/vendor_build/mithrilhook/build/tests/controls/
            build/ci-hook-${{ matrix.configuration }}/vendor_build/mithrilhook/build/tests/${{ matrix.configuration }}/*.exe
            build/ci-hook-${{ matrix.configuration }}/${{ matrix.configuration }}/hook*.exe
            build/ci-hook-${{ matrix.configuration }}/${{ matrix.configuration }}/application_runtime_contracts.exe
            build/ci-hook-${{ matrix.configuration }}/fixtures/${{ matrix.configuration }}/laureondo_online.dll
            build/ci-hook-${{ matrix.configuration }}/CMakeCache.txt
            build/ci-hook-${{ matrix.configuration }}/CMakeFiles/CMakeConfigureLog.yaml
            metadata/HOOK_ENGINE.json
            third_party/mithrilhook/metadata/SOURCE_MANIFEST.json
          if-no-files-found: warn
          retention-days: 14

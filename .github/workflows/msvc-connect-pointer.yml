name: Windows connect pointer acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect-pointer:
    name: Windows x64 connect pointer ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Configure native connect acceptance
        run: |
          $build = 'build/ci-connect-${{ matrix.configuration }}'
          cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DLAUREONDO_BUILD_SOURCE_API_DLL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'MSVC connect configure failed' }
      - name: Build production and retained-reference connect regressions
        run: |
          $build = 'build/ci-connect-${{ matrix.configuration }}'
          cmake --build $build --config '${{ matrix.configuration }}' --target crypt_diagnostic_failure_contracts production_callback_contracts production_network_hook_contracts native_callback_contracts network_hook_contracts --parallel 2 2>&1 | Tee-Object -FilePath "$build/connect-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC connect build failed' }
      - name: Run native connect regressions and real Winsock equivalence
        run: |
          $build = 'build/ci-connect-${{ matrix.configuration }}'
          $junit = Join-Path (Resolve-Path $build) 'connect-junit.xml'
          ctest --test-dir $build -C '${{ matrix.configuration }}' -R '^(crypt_diagnostic_failure_contracts|production_callback_contracts|production_network_hook_contracts|native_callback_contracts|network_hook_contracts)$' --no-tests=error --output-on-failure --output-junit $junit 2>&1 | Tee-Object -FilePath "$build/connect-ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC connect regression failed' }
      - name: Preserve native connect evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msvc-connect-${{ matrix.configuration }}-evidence
          path: |
            build/ci-connect-${{ matrix.configuration }}/connect-build.log
            build/ci-connect-${{ matrix.configuration }}/connect-ctest.log
            build/ci-connect-${{ matrix.configuration }}/connect-junit.xml
            build/ci-connect-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
            build/ci-connect-${{ matrix.configuration }}/CMakeCache.txt
            build/ci-connect-${{ matrix.configuration }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

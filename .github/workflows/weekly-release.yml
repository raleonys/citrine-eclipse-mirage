# SPDX-License-Identifier: GPL-3.0-only

name: Weekly draft release

on:
  schedule:
    - cron: '30 13 * * 5' # Friday 13:30 UTC.
  workflow_dispatch:
    inputs:
      start_tag:
        description: 'Optional exact next x.y.z-CODENAME; blank follows the approved LUTRAVEX queue.'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: weekly-draft-release
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  plan:
    name: Plan and validate source
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Draft visibility is required; this job only reads releases.
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      source: ${{ steps.plan.outputs.source }}
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Find new commits or resume an incomplete candidate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          START_TAG: ${{ inputs.start_tag || '' }}
        run: python -B scripts/weekly_release.py plan --output build/weekly-plan.json --start-tag "$START_TAG"
      - name: Verify source and dependency contracts
        if: steps.plan.outputs.ready == 'true'
        run: python -B scripts/run_source_qa.py --report build/qa/weekly-source-qa.json
      - name: Run portable tests
        if: steps.plan.outputs.ready == 'true'
        run: |
          cmake -S . -B build/weekly-portable -DPRELOADER_L_PORTABLE_CHECKS_ONLY=ON
          cmake --build build/weekly-portable --parallel 2
          ctest --test-dir build/weekly-portable --output-on-failure --output-junit "$GITHUB_WORKSPACE/build/weekly-portable/CTEST_RESULTS.xml"
          test -s "$GITHUB_WORKSPACE/build/weekly-portable/CTEST_RESULTS.xml"
      - name: Package exact source and checksums
        if: steps.plan.outputs.ready == 'true'
        run: python -B scripts/weekly_release.py source --plan build/weekly-plan.json --output "$RUNNER_TEMP/weekly-source"
      - name: Retain source candidate
        if: steps.plan.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-source
          path: ${{ runner.temp }}/weekly-source/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Validate Windows ${{ matrix.profile }}
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: native
            script: build_native_acceptance.ps1
          - profile: production
            script: build_production.ps1
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run existing native MSVC profile
        run: |
          & "./scripts/build_orchestration/${{ matrix.script }}" -BuildDir "build/weekly-${{ matrix.profile }}" -Config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bind evidence to the exact source and DLL
        run: |
          python -B scripts/weekly_release.py capture --profile "${{ matrix.profile }}" --build "build/weekly-${{ matrix.profile }}" --output "$env:RUNNER_TEMP/weekly-evidence" --source "${{ needs.plan.outputs.source }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain validated Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-windows-${{ matrix.profile }}
          path: ${{ runner.temp }}/weekly-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-failed-${{ matrix.profile }}
          path: |
            build/weekly-${{ matrix.profile }}/BUILD_RECEIPT.json
            build/weekly-${{ matrix.profile }}/BUILD_TOOLCHAIN_PROVENANCE.log
            build/weekly-${{ matrix.profile }}/CTEST_RESULTS.xml
            build/weekly-${{ matrix.profile }}/Testing/Temporary/*.log
            build/weekly-${{ matrix.profile }}/golden/*.json
          if-no-files-found: warn
          retention-days: 14

  draft:
    name: Assemble a draft for owner review
    needs: [plan, windows]
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Retrieve artifacts from this run only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name weekly-source --dir "$RUNNER_TEMP/weekly-payload"
          gh run download "$GITHUB_RUN_ID" --name weekly-windows-native --dir "$RUNNER_TEMP/weekly-payload"
          gh run download "$GITHUB_RUN_ID" --name weekly-windows-production --dir "$RUNNER_TEMP/weekly-payload"
      - name: Validate and package the complete candidate
        run: python -B scripts/weekly_release.py bundle --payload "$RUNNER_TEMP/weekly-payload" --output "$RUNNER_TEMP/weekly-assets"
      - name: Create or finish the draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/weekly_release.py draft --plan "$RUNNER_TEMP/weekly-payload/plan.json" --assets "$RUNNER_TEMP/weekly-assets"

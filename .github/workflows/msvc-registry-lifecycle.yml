name: Windows registry lifecycle acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-lifecycle:
    name: Windows x64 registry lifecycle ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Configure source-linked native Registry fixtures
        run: |
          $build = 'build/ci-registry-${{ matrix.configuration }}'
          cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DPRELOADER_L_BUILD_SOURCE_API_DLL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native Registry configure failed' }
      - name: Build Registry lifecycle and allocation regressions
        run: |
          $build = 'build/ci-registry-${{ matrix.configuration }}'
          cmake --build $build --config '${{ matrix.configuration }}' --target registry_native_lifecycle_contracts registry_allocation_failure_contracts registry_contracts --parallel 2 2>&1 | Tee-Object -FilePath "$build/registry-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native Registry build failed' }
      - name: Exercise real SDK keys and retain reuse observations
        run: |
          $build = 'build/ci-registry-${{ matrix.configuration }}'
          $junit = Join-Path (Resolve-Path $build) 'registry-junit.xml'
          ctest --test-dir $build -C '${{ matrix.configuration }}' -R '^(registry_native_lifecycle_contracts|registry_allocation_failure_contracts|registry_contracts)$' --no-tests=error --verbose --output-on-failure --output-junit $junit 2>&1 | Tee-Object -FilePath "$build/registry-ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native Registry regression failed' }
      - name: Preserve native Registry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msvc-registry-${{ matrix.configuration }}-evidence
          path: |
            build/ci-registry-${{ matrix.configuration }}/registry-build.log
            build/ci-registry-${{ matrix.configuration }}/registry-ctest.log
            build/ci-registry-${{ matrix.configuration }}/registry-junit.xml
            build/ci-registry-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
            build/ci-registry-${{ matrix.configuration }}/CMakeCache.txt
            build/ci-registry-${{ matrix.configuration }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

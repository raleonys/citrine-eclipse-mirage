# SPDX-License-Identifier: GPL-3.0-only
name: Isolated XML backend comparison

on:
  pull_request:
    paths:
      - "tests/diagnostics/xml_backend/**"
      - "docs/XML_BACKEND_COMPARISON.md"
      - ".github/workflows/xml-backend-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    name: XML diagnostic ${{ matrix.os }} sanitizers=${{ matrix.sanitizers }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sanitizers: false
          - os: ubuntu-24.04
            sanitizers: true
          - os: windows-2022
            sanitizers: false
    steps:
      - name: Preserve pinned input bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out the reviewed PR 108 control without changing this PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: a34a0536f0980b38d77d029f11fa3720dcaedc6e
          path: build/xml-reference
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Compare checked reference decoding, protocol, storage and allocations
        shell: bash
        run: |
          options=()
          if [ '${{ matrix.sanitizers }}' = 'true' ]; then options+=(--sanitizers); fi
          python -B tests/diagnostics/xml_backend/run.py \
            --reference-root build/xml-reference \
            --pugixml-root build/xml-comparison-input/pugixml --fetch-pugixml \
            --output build/xml-backend-comparison "${options[@]}"
      - name: Retain differential results, input pins, compiler settings and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xml-comparison-${{ matrix.os }}-sanitizers-${{ matrix.sanitizers }}
          path: |
            build/xml-backend-comparison/*.log
            build/xml-backend-comparison/*.json
            build/xml-backend-comparison/*.tsv
            build/xml-backend-comparison/*.csv
            build/xml-backend-comparison/binaries/CMakeCache.txt
            build/xml-backend-comparison/binaries/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

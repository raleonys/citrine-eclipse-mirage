name: Windows queued shutdown retry acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queued-shutdown:
    name: Windows x64 queued shutdown ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Configure native fixture
        run: |
          $build = 'build/ci-queued-shutdown-${{ matrix.configuration }}'
          cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DCITRINE_ECLIPSE_MIRAGE_BUILD_SOURCE_API_DLL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Shutdown queue configure failed' }
      - name: Build actual entry and shutdown failure fixtures
        run: |
          $build = 'build/ci-queued-shutdown-${{ matrix.configuration }}'
          cmake --build $build --config '${{ matrix.configuration }}' --target application_shutdown_failure_contracts --parallel 2 2>&1 | Tee-Object -FilePath "$build/queued-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Shutdown queue fixture build failed' }
      - name: Verify startup overlap and distinct queued shutdown retries
        run: |
          $build = 'build/ci-queued-shutdown-${{ matrix.configuration }}'
          $junit = Join-Path (Resolve-Path $build) 'queued-junit.xml'
          ctest --test-dir $build -C '${{ matrix.configuration }}' -R '^application_shutdown_failure_contracts$' --no-tests=error --verbose --output-on-failure --output-junit $junit 2>&1 | Tee-Object -FilePath "$build/queued-ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'Queued shutdown retry regression failed' }
      - name: Preserve native acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msvc-queued-shutdown-${{ matrix.configuration }}-evidence
          path: |
            build/ci-queued-shutdown-${{ matrix.configuration }}/queued-build.log
            build/ci-queued-shutdown-${{ matrix.configuration }}/queued-ctest.log
            build/ci-queued-shutdown-${{ matrix.configuration }}/queued-junit.xml
            build/ci-queued-shutdown-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
            build/ci-queued-shutdown-${{ matrix.configuration }}/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

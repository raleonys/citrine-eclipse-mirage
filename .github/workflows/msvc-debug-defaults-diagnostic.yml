name: MSVC Debug configuration defaults diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/msvc-debug-defaults-diagnostic.yml'

permissions:
  contents: read

jobs:
  isolated-msvc-debug:
    name: MSVC Debug isolated config-defaults test
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure MSVC x64 portable checks
        shell: pwsh
        run: cmake -S . -B build/msvc-defaults-diagnostic -G "Visual Studio 17 2022" -A x64 -DPRELOADER_L_PORTABLE_CHECKS_ONLY=ON
      - name: Build isolated Debug target
        shell: pwsh
        run: cmake --build build/msvc-defaults-diagnostic --config Debug --target portable_configuration_defaults --parallel 2
      - name: Verify Debug executable
        shell: pwsh
        run: |
          $target = 'build/msvc-defaults-diagnostic/Debug/portable_configuration_defaults.exe'
          if (-not (Test-Path -LiteralPath $target)) { throw "Missing Debug test executable: $target" }
          Get-Item -LiteralPath $target | Select-Object FullName, Length
      - name: Run isolated test and collect stage breadcrumbs
        shell: pwsh
        run: |
          $build = 'build/msvc-defaults-diagnostic'
          ctest --test-dir $build -C Debug -R '^portable_configuration_defaults$' --output-on-failure --verbose --timeout 75 --output-junit "$build/CTEST_RESULTS.xml" 2>&1 | Tee-Object -FilePath "$build/config_defaults_debug_ctest.log"
          $testExit = $LASTEXITCODE
          "CTEST_EXIT_CODE=$testExit" | Set-Content -Path "$build/CTEST_EXIT_CODE.txt"
          if ($testExit -ne 0) { exit $testExit }
      - name: Retain Windows Debug diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msvc-config-defaults-debug-evidence
          path: |
            build/msvc-defaults-diagnostic/CTEST_EXIT_CODE.txt
            build/msvc-defaults-diagnostic/config_defaults_debug_ctest.log
            build/msvc-defaults-diagnostic/CTEST_RESULTS.xml
            build/msvc-defaults-diagnostic/Testing/Temporary/LastTest.log
            build/msvc-defaults-diagnostic/CMakeCache.txt
            build/msvc-defaults-diagnostic/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

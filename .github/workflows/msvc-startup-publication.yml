# SPDX-License-Identifier: GPL-3.0-only
name: Windows MSVC startup publication acceptance

on:
  pull_request:
    paths:
      - "src/runtime/**"
      - "src/net/**"
      - "src/config/**"
      - "include/preloader_l/runtime/**"
      - "include/preloader_l/net/**"
      - "tests/native/startup_publication_tests.cpp"
      - "tests/support/runtime/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/msvc-startup-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-startup-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-publication:
    name: Windows x64 startup publication ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Configure genuine Windows startup contract
        run: |
          $build = 'build/ci-startup-${{ matrix.configuration }}'
          cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DPRELOADER_L_BUILD_SOURCE_API_DLL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'MSVC startup configure failed' }
      - name: Build actual startup publication test
        run: |
          $build = 'build/ci-startup-${{ matrix.configuration }}'
          cmake --build $build --config '${{ matrix.configuration }}' --target startup_publication_contracts --parallel 2 2>&1 | Tee-Object -FilePath "$build/startup-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC startup test build failed' }
      - name: Run native startup publication regression
        run: |
          $build = 'build/ci-startup-${{ matrix.configuration }}'
          $junit = Join-Path (Resolve-Path $build) 'startup-junit.xml'
          ctest --test-dir $build -C '${{ matrix.configuration }}' -R '^startup_publication_contracts$' --no-tests=error --output-on-failure --timeout 120 --output-junit $junit 2>&1 | Tee-Object -FilePath "$build/startup-ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native startup publication regression failed' }
      - name: Preserve compiler and native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-publication-${{ matrix.configuration }}-evidence
          path: |
            build/ci-startup-${{ matrix.configuration }}/startup-build.log
            build/ci-startup-${{ matrix.configuration }}/startup-ctest.log
            build/ci-startup-${{ matrix.configuration }}/startup-junit.xml
            build/ci-startup-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
            build/ci-startup-${{ matrix.configuration }}/CMakeCache.txt
            build/ci-startup-${{ matrix.configuration }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

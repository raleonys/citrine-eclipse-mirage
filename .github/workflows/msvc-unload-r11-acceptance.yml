# SPDX-License-Identifier: GPL-3.0-only
name: Windows unload scan R11 acceptance

on:
  pull_request:
    paths:
      - "src/platform/hook_unload_guard.cpp"
      - "include/preloader_l/platform/hook_unload_guard.hpp"
      - "tests/native/unload_guard_tests.cpp"
      - "cmake/Tests.cmake"
      - "CMakeLists.txt"
      - ".github/workflows/msvc-unload-r11-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unload-r11:
    name: Windows x64 unload guard R11 ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Configure Windows unload-guard fixture
        run: |
          $build = 'build/ci-unload-r11-${{ matrix.configuration }}'
          cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DPRELOADER_L_BUILD_SOURCE_API_DLL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Unload guard configure failed' }
      - name: Build actual source-included scanner fixture
        run: |
          $build = 'build/ci-unload-r11-${{ matrix.configuration }}'
          cmake --build $build --config '${{ matrix.configuration }}' --target unload_guard_contracts --parallel 2 2>&1 | Tee-Object -FilePath "$build/scan-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Unload guard build failed' }
      - name: Require R11, caller exclusion and retained handle regressions
        run: |
          $build = 'build/ci-unload-r11-${{ matrix.configuration }}'
          $junit = Join-Path (Resolve-Path $build) 'scan-junit.xml'
          ctest --test-dir $build -C '${{ matrix.configuration }}' -R '^unload_guard_contracts$' --no-tests=error --output-on-failure --output-junit $junit 2>&1 | Tee-Object -FilePath "$build/scan-ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'Unload guard R11 regression failed' }
      - name: Preserve compiler and regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msvc-unload-r11-${{ matrix.configuration }}-evidence
          path: |
            build/ci-unload-r11-${{ matrix.configuration }}/scan-build.log
            build/ci-unload-r11-${{ matrix.configuration }}/scan-ctest.log
            build/ci-unload-r11-${{ matrix.configuration }}/scan-junit.xml
            build/ci-unload-r11-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
            build/ci-unload-r11-${{ matrix.configuration }}/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

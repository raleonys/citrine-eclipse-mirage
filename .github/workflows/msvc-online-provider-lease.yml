name: Windows online provider module lease acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-lease:
    name: Windows x64 provider lease ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Configure native provider fixture
        run: |
          $build = 'build/ci-provider-${{ matrix.configuration }}'
          cmake -S . -B $build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DLAUREONDO_BUILD_SOURCE_API_DLL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Provider lease configure failed' }
      - name: Build source-linked provider and failure fixtures
        run: |
          $build = 'build/ci-provider-${{ matrix.configuration }}'
          cmake --build $build --config '${{ matrix.configuration }}' --target extra_library_failure_contracts application_runtime_contracts online_contracts hook_transaction_contracts --parallel 2 2>&1 | Tee-Object -FilePath "$build/provider-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Provider lease build failed' }
      - name: Exercise real Windows image ownership and retry
        run: |
          $build = 'build/ci-provider-${{ matrix.configuration }}'
          $junit = Join-Path (Resolve-Path $build) 'provider-junit.xml'
          ctest --test-dir $build -C '${{ matrix.configuration }}' -R '^(extra_library_failure_contracts|application_runtime_contracts|online_contracts|hook_transaction_contracts)$' --repeat until-fail:3 --no-tests=error --verbose --output-on-failure --output-junit $junit 2>&1 | Tee-Object -FilePath "$build/provider-ctest.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native provider lease fixture failed' }
      - name: Preserve native acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msvc-provider-${{ matrix.configuration }}-evidence
          path: |
            build/ci-provider-${{ matrix.configuration }}/provider-build.log
            build/ci-provider-${{ matrix.configuration }}/provider-ctest.log
            build/ci-provider-${{ matrix.configuration }}/provider-junit.xml
            build/ci-provider-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
            build/ci-provider-${{ matrix.configuration }}/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14
